<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finance Manager</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Finance Manager</h1>
        <p>Expense tracking from bank statements</p>
      </div>
      <form id="account-form" class="account-form">
        <input id="account-name" name="name" placeholder="Account name" required />
        <select id="account-type" name="type">
          <option value="bank">Bank</option>
          <option value="credit">Credit card</option>
          <option value="wallet">Wallet</option>
          <option value="cash">Cash</option>
        </select>
        <button type="submit">Add Account</button>
      </form>
    </header>

    <main>
      <section class="toolbar">
        <label>
          Account
          <select id="account-select"></select>
        </label>
        <label>
          From
          <input id="start-date" type="date" />
        </label>
        <label>
          To
          <input id="end-date" type="date" />
        </label>
        <button id="refresh-button" type="button">Refresh</button>
      </section>

      <section class="import-band">
        <form id="upload-form" class="upload-form">
          <div>
            <h2>Import Statement</h2>
            <p>Upload CSV, XLSX, XLSM, or best-effort PDF statements.</p>
          </div>
          <input id="statement-file" type="file" accept=".csv,.xlsx,.xlsm,.pdf" required />
          <button type="submit">Upload</button>
        </form>
        <p id="status-line" class="status-line"></p>
      </section>

      <section class="kpi-grid" id="kpi-grid">
        <article class="kpi">
          <span>Total Spend</span>
          <strong id="kpi-spend">-</strong>
        </article>
        <article class="kpi">
          <span>Income</span>
          <strong id="kpi-income">-</strong>
        </article>
        <article class="kpi">
          <span>Net Cashflow</span>
          <strong id="kpi-net">-</strong>
        </article>
        <article class="kpi">
          <span>Transactions</span>
          <strong id="kpi-count">-</strong>
        </article>
      </section>

      <section class="dashboard-grid">
        <section class="panel">
          <div class="section-title">
            <h2>Category Spend</h2>
          </div>
          <div id="category-bars" class="bars"></div>
        </section>

        <section class="panel">
          <div class="section-title">
            <h2>Monthly Cashflow</h2>
          </div>
          <canvas id="cashflow-chart" width="720" height="320"></canvas>
        </section>
      </section>

      <section class="panel transactions-panel">
        <div class="section-title">
          <h2>Recent Transactions</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Merchant</th>
                <th>Category</th>
                <th>Type</th>
                <th class="amount">Amount</th>
              </tr>
            </thead>
            <tbody id="transaction-table"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
